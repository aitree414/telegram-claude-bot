<text x="40" y="470" class="title">NOTES 備註</text>
<text x="50" y="484" class="note">1. ALL DIMENSIONS IN MILLIMETERS UNLESS STATED.  除特別標註外所有尺寸為公釐。</text>
<text x="50" y="497" class="note">2. EXHIBITION VENUE: HONG KONG CENTRAL LIBRARY.  展覽場地：香港中央圖書館。</text>
<text x="50" y="510" class="note">3. MOVE-IN: 25 AUG 2026 | MOVE-OUT: 7 SEP 2026.  進場 8月25日 | 撤場 9月7日。</text>
<text x="50" y="523" class="note">4. ALL WALL STRUCTURES H=3200mm, WOODEN FRAME + PAINT FINISH.  所有展牆 H=3200mm，木框架+烤漆。</text>
<text x="50" y="536" class="note">5. TRUSS SYSTEM: H=3800mm, L=13600mm, W=10600mm, ALUMINUM.  框架鋁合金 Truss。</text>
<text x="50" y="549" class="note">6. PROJECTION MAPPING: 12× 10000Lm PROJECTORS + SHORT FOCUS LENS.  12台投影機。</text>
<text x="50" y="562" class="note">7. FLOOR LOADING: MAX 5kN/m².  地面載重。</text>
<text x="50" y="575" class="note">8. FIRE EXITS MUST REMAIN CLEAR AT ALL TIMES.  消防通道須保持暢通。</text>
